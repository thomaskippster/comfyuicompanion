name: Maven Release & Deploy to SourceForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.1.0). If empty, auto-detects from pom.xml'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    permissions:
      contents: write
      packages: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "IS_BUMP=true" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "IS_BUMP=false" >> $GITHUB_ENV
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "IS_BUMP=false" >> $GITHUB_ENV
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Configure Git User
        if: env.IS_BUMP == 'true'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Update Version in pom.xml
        if: env.IS_BUMP == 'true'
        run: |
          mvn -B versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false

      - name: Commit and Tag Version Bump
        if: env.IS_BUMP == 'true'
        run: |
          git add pom.xml
          git diff --cached --quiet || git commit -m "chore: bump version to ${{ env.VERSION }}"
          git tag -f v${{ env.VERSION }}
          git push origin main
          git push origin v${{ env.VERSION }} --force

      - name: Build Project
        run: |
          mvn -B clean package -DskipTests

      - name: Generate SHA-256 Checksum
        run: |
          sha256sum target/comfyuicompanion.jar | cut -d ' ' -f 1 > target/comfyuicompanion.jar.sha256
          echo "SHA-256 Checksum:"
          cat target/comfyuicompanion.jar.sha256

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SF_SSH_KEY }}
          known_hosts: unnecessary
          if_key_exists: replace

      - name: Add SourceForge to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 frs.sourceforge.net >> ~/.ssh/known_hosts

      - name: Upload to SourceForge
        run: |
          REL_VERSION="v${{ env.VERSION }}"
          SF_USER="${{ secrets.SF_USERNAME }}"
          PROJECT_NAME="${{ secrets.SF_PROJECT_NAME }}"
          PROJECT_NAME="${PROJECT_NAME:-companion-for-comfyui}"

          echo "Uploading version $REL_VERSION to project $PROJECT_NAME on SourceForge..."

          printf "%s\n" \
            "-mkdir /home/frs/project/$PROJECT_NAME/$REL_VERSION" \
            "put target/comfyuicompanion.jar /home/frs/project/$PROJECT_NAME/$REL_VERSION/" \
            "put target/comfyuicompanion.jar.sha256 /home/frs/project/$PROJECT_NAME/$REL_VERSION/" \
            "quit" > sftp_batch

          sftp -b sftp_batch -o StrictHostKeyChecking=no $SF_USER@frs.sourceforge.net

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || env.IS_BUMP == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/comfyuicompanion.jar
            target/comfyuicompanion.jar.sha256
          tag_name: v${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

